<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title }} — Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-5">
  <div class="mx-auto" style="max-width: 640px;">
    <div class="card shadow-sm">
      <div class="card-body text-center">
        <h2 class="mb-1">{{ title }} — Result</h2>
        <p class="text-muted mb-4">Student: {{ full_name or 'N/A' }} ({{ student_id }})</p>

        {% if passed %}
          <div class="alert alert-success"><strong>✅ PASS</strong></div>
        {% else %}
          <div class="alert alert-danger"><strong>❌ FAIL</strong></div>
        {% endif %}

        <div class="display-4 fw-bold mb-2">{{ "%.2f"|format(score) }}%</div>
        <p class="text-muted">Correct: {{ correct }} / {{ total }} • Pass mark: {{ pass_mark }}%</p>

        <a href="{{ url_for('airside_induction') }}" class="btn btn-primary">Retake Assessment</a>
      </div>
    </div>
  </div>
</body>
</html>
