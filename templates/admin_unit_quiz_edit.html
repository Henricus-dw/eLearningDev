<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Edit Unit Quiz — {{ unit_key }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style> textarea{font-family: ui-monospace, Menlo, Consolas, monospace; min-height: 60vh;} </style>
</head>
<body class="container py-4">
  <h3>Edit Unit Quiz — {{ unit_key }}</h3>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Quiz JSON</label>
      <textarea name="json_text" class="form-control">{{ json_text }}</textarea>
    </div>
    <button class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin_attempts_unit', course_id=course_id, unit_key=unit_key) }}" class="btn btn-outline-secondary">View Attempts</a>
  </form>
</body>
</html>
