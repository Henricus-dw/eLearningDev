<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="page-context" data-page="Assessment" data-course="{{ course.course_name }}" data-chapter="" />
    <title>{{ course.course_name }} - Final Assessment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>📋 Final Assessment - {{ course.course_name }}</h2>

    <form action="{{ url_for('submit_assessment', course_id=course.id) }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="student_id" value="{{ student.id }}">

        <!-- ✅ Video Recording Section -->
        <div class="mb-3">
            <label class="form-label">📹 Camera Recording</label>
            <video id="video" autoplay class="border border-dark"></video>
            <button type="button" class="btn btn-danger mt-2" onclick="startRecording()">🎥 Start Recording</button>
            <button type="button" class="btn btn-secondary mt-2" onclick="stopRecording()">⏹ Stop Recording</button>
            <input type="hidden" id="videoData" name="video_data">
        </div>

        <!-- ✅ Display Assessment Questions -->
        {% for question in questions %}
            <div class="mb-3">
                <label class="form-label">{{ question.text }}</label>
                <div>
                    {% for option in question.options %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ option }}" required>
                            <label class="form-check-label">{{ option }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}

        <!-- ✅ Submission Button -->
        <button type="submit" id="submitButton" class="btn btn-success" disabled>Submit Assessment</button>

        <!-- ✅ Upload Progress Bar -->
        <div class="progress mt-3" style="display: none;">
            <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
    </form>

    <script>
        let mediaRecorder;
        let recordedChunks = [];

        async function startRecording() {
            try {
                let stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('video').srcObject = stream;
                
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = event => recordedChunks.push(event.data);
                mediaRecorder.onstop = () => {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    let reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => document.getElementById('videoData').value = reader.result;
                };

                mediaRecorder.start();
                document.getElementById('submitButton').disabled = false; // Enable submit when recording starts
            } catch (error) {
                alert("⚠ Camera access is required for the assessment!");
            }
        }

        function stopRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
            }
        }
    </script>
    {% include 'partials/heartbeat.html' %}
</body>
</html>
