<!DOCTYPE html>
<html lang="en" class="dark" data-theme>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Company — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <a href="{{ url_for('admin_companies') }}" class="text-sm text-slate-600 dark:text-slate-300 hover:underline">&larr; Back to Companies</a>
    <h1 class="text-2xl font-bold mt-2">Create Company</h1>

    <form method="post" class="mt-6 space-y-4 bg-white dark:bg-slate-800 rounded-xl p-6 ring-1 ring-slate-200 dark:ring-slate-700 shadow">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1">Company Name *</label>
          <input name="name" required class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2 shadow-sm focus:ring-2 focus:ring-amber-300">
        </div>
        <div>
          <label class="block text-sm mb-1">Registration No</label>
          <input name="reg_no" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm mb-1">Industry</label>
          <input name="industry" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm mb-1">Phone</label>
          <input name="contact_phone" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
        </div>
      </div>

      <div>
        <label class="block text-sm mb-1">Address</label>
        <input name="address" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1">Contact Name</label>
          <input name="contact_name" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
        </div>
        <div>
          <label class="block text-sm mb-1">Contact Email</label>
          <input name="contact_email" type="email" class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/90 dark:bg-slate-700 px-3 py-2">
        </div>
      </div>

      <div class="pt-2">
        <button class="inline-flex items-center gap-2 rounded-full px-5 py-2.5 bg-amber-500 text-slate-900 font-semibold shadow hover:brightness-95">
          <i class="fa-solid fa-floppy-disk"></i> Save Company
        </button>
      </div>
    </form>
  </div>
</body>
</html>
