<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Add Question</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h4 class="mb-3">Add Question → {{ chapter.title }}</h4>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mb-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category in ['success','ok'] else ('danger' if category in ['error','danger'] else 'info') }} mb-2">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Question</label>
      <textarea name="question" class="form-control" rows="3" required></textarea>
    </div>

    <div class="row g-2">
      <div class="col-sm-6">
        <label class="form-label">Option A</label>
        <input name="opt1" class="form-control" placeholder="Option A">
      </div>
      <div class="col-sm-6">
        <label class="form-label">Option B</label>
        <input name="opt2" class="form-control" placeholder="Option B">
      </div>
      <div class="col-sm-6">
        <label class="form-label">Option C</label>
        <input name="opt3" class="form-control" placeholder="Option C">
      </div>
      <div class="col-sm-6">
        <label class="form-label">Option D</label>
        <input name="opt4" class="form-control" placeholder="Option D">
      </div>
    </div>

    <div class="mt-3">
      <label class="form-label">Correct (index 0–3 or a/b/c/d)</label>
      <input name="correct" class="form-control" placeholder="0 or a">
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary">Save</button>
      <a class="btn btn-secondary" href="{{ url_for('edit_chapter', chapter_id=chapter.id) }}">Cancel</a>
    </div>
  </form>
</body>
</html>
