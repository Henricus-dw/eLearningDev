<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edit POPIA Content</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow p-6">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-2xl font-bold text-slate-900">POPIA Content Editor</h1>
      <a href="{{ url_for('admin_dashboard') }}" class="px-3 py-2 rounded-lg bg-slate-800 text-white hover:bg-slate-900">⬅ Back</a>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Version (POPIA_VERSION)</label>
        <input type="text" name="version" value="{{ version }}" class="w-48 rounded-lg border border-slate-300 p-2" />
        <p class="text-xs text-slate-500 mt-1">
          Changing this re-prompts students once for the new version (in-memory until app restart).
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Content (HTML)</label>
        <textarea name="content" rows="20" class="w-full rounded-xl border border-slate-300 p-3 font-mono text-sm">{{ content|e }}</textarea>
        <p class="text-xs text-slate-500 mt-1">This file is saved to <code>/var/enroll/popia_content.html</code>. A timestamped backup is written to <code>/var/enroll/backups</code>.</p>
      </div>

      <div class="flex items-center gap-2">
        <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">💾 Save</button>
        <a href="{{ url_for('popia_notice') }}" class="px-4 py-2 rounded-lg bg-slate-200 text-slate-800 hover:bg-slate-300" target="_blank">👀 Preview as student</a>
      </div>
    </form>
  </div>
</body>
</html>
