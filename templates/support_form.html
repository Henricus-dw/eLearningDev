<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Centre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>🆘 Support Centre</h2>
    <p>If you need help, please fill in the details below.</p>

    <!-- ✅ Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('support') }}" method="POST">
        <!-- Name and Email (Autofilled, Readonly) -->
        <div class="mb-3">
            <label class="form-label">Name & Surname</label>
            <input type="text" class="form-control" value="{{ student.name }} {{ student.surname }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" value="{{ student.email }}" readonly>
        </div>

        <!-- ✅ Ticket ID (Auto-generated, Readonly) -->
        <div class="mb-3">
            <label class="form-label">Ticket ID</label>
            <input type="text" class="form-control" value="{{ ticket_id }}" readonly>
        </div>

        <!-- ✅ Course Dropdown -->
        <div class="mb-3">
            <label class="form-label">Course</label>
            <select name="course_id" class="form-select" required>
                <option value="">Select a Course</option>
                {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.title }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- ✅ Problem Description -->
        <div class="mb-3">
            <label class="form-label">Problem Description</label>
            <textarea name="problem_description" class="form-control" rows="4" placeholder="Describe your issue..." required></textarea>
        </div>

        <!-- ✅ Submit Button -->
        <button type="submit" class="btn btn-primary w-100">📩 Submit Ticket</button>
    </form>

    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
</body>
</html>
