<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply to Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2>📩 Reply to Ticket #{{ ticket.ticket_id }}</h2>
    <p><strong>Student:</strong> {{ ticket.student.name }} {{ ticket.student.surname }}</p>
    <p><strong>Course:</strong> {{ ticket.course.title }}</p>
    <p><strong>Issue:</strong> {{ ticket.problem_description }}</p>

    <form action="{{ url_for('reply_ticket', ticket_id=ticket.id) }}" method="POST">
        <div class="mb-3">
            <label for="reply_message" class="form-label">Reply Message</label>
            <textarea class="form-control" id="reply_message" name="reply_message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">📩 Send Reply</button>
        <a href="{{ url_for('support_centre') }}" class="btn btn-secondary">⬅ Back to Support Centre</a>
    </form>
</body>
</html>
