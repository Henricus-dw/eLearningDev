<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .profile-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="profile-container">
            <h2 class="text-center">🔄 Update Profile</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/update_profile" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">New Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                </div>

                <div class="mb-3">
                    <label for="cell_number" class="form-label">New Cell Number</label>
                    <input type="tel" class="form-control" id="cell_number" name="cell_number" value="{{ student.cell_number }}" required>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password (Leave Blank if No Change)</label>
                    <input type="password" class="form-control" id="new_password" name="new_password">
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password">
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
