<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <script defer>
        function openCamera(id) {
            const video = document.getElementById(id);
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                })
                .catch(err => console.error("Camera access denied: ", err));
        }
        function captureImage(videoId, inputId) {
            const video = document.getElementById(videoId);
            const canvas = document.createElement('canvas');
            canvas.width = 640;  // Resize to reduce file size
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL("image/jpeg", 0.7); // Compress image
            document.getElementById(inputId).value = imageData;
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-primary {
            width: 100%;
        }
        video {
            width: 100%;
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center">Manage Users</h2>
        
        <!-- Create User Form -->
        <h4>Create New User</h4>
    
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
        
            <div class="mb-3">
                <label for="surname" class="form-label">Surname</label>
                <input type="text" class="form-control" id="surname" name="surname" required>
            </div>
        
            <div class="mb-3">
                <label for="cell_number" class="form-label">Cell Number</label>
                <input type="text" class="form-control" id="cell_number" name="cell_number" required>
            </div>
        
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
        
            <!-- ✅ Selfie Capture -->
            <div class="mb-3">
                <label for="selfie" class="form-label">Capture Selfie</label>
                <input type="file" class="form-control" id="selfie" name="selfie" accept="image/*" capture="user" required>
            </div>
        
            <!-- ✅ ID Document Upload -->
            <div class="mb-3">
                <label for="id_upload" class="form-label">Upload ID Document</label>
                <input type="file" class="form-control" id="id_upload" name="id_upload" accept="image/*" capture="environment" required>
            </div>
        
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="Admin">Admin</option>
                    <option value="Support">Support</option>
                    <option value="Enrollment">Enrollment</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Create User</button>
        </form>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.name }}</td>
                    <td>{{ user.surname }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.role }}</td>
                    <td>
                        <a href="{{ url_for('edit_user', user_id=user.id) }}" class="btn btn-warning btn-sm">Modify</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
