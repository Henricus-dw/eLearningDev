<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4 py-8">

    <div class="bg-white shadow-md rounded-lg w-full max-w-2xl p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">✏️ Edit User</h2>

        <form method="POST" action="{{ url_for('edit_user', user_id=user.id) }}" class="space-y-5">
            <div>
                <label for="name" class="block font-medium text-gray-700 mb-1">Name</label>
                <input type="text" id="name" name="name" value="{{ user.name }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-400"
                       required>
            </div>

            <div>
                <label for="surname" class="block font-medium text-gray-700 mb-1">Surname</label>
                <input type="text" id="surname" name="surname" value="{{ user.surname }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-400"
                       required>
            </div>

            <div>
                <label for="cell_number" class="block font-medium text-gray-700 mb-1">Cell Number</label>
                <input type="text" id="cell_number" name="cell_number" value="{{ user.cell_number }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-400"
                       required>
            </div>

            <div>
                <label for="email" class="block font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}"
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-400"
                       required>
            </div>

            <div>
                <label for="role" class="block font-medium text-gray-700 mb-1">Role</label>
                <select id="role" name="role"
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-400">
                    <option value="Accountant" {% if user.role == 'Accountant' %}selected{% endif %}>Accountant</option>
                    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                    {% if admin_role_level >= 4 %}
                    <option value="Super Admin" {% if user.role == 'Super Admin' %}selected{% endif %}>Super Admin</option>
                    <option value="Developer" {% if user.role == 'Developer' %}selected{% endif %}>Developer</option>
                    {% endif %}
                </select>
            </div>

            <div class="flex justify-between items-center mt-6">
                <a href="{{ url_for('manage_users') }}"
                   class="inline-block bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded shadow">
                    ⬅ Back
                </a>
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded shadow">
                    ✅ Update
                </button>
            </div>
        </form>
    </div>

</body>
</html>
