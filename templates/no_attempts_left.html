<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No Attempts Left — {{ course_title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-5">
  <div class="mx-auto" style="max-width:820px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-2">No Attempts Remaining</h3>
        <p class="text-muted mb-4">
          You’ve used all <strong>{{ attempts_allowed }}</strong> attempts for
          <strong>{{ course_title }}</strong> (used: {{ attempts_used }}).
        </p>
        <div class="alert alert-warning">
          Please contact <strong>Professional Training</strong> to request another attempt:
          <div class="mt-2">
            📧 <a href="mailto:{{ contact_email }}">{{ contact_email }}</a><br>
            ☎️ {{ contact_phone }}
          </div>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">⬅ Back to Dashboard</a>
      </div>
    </div>
  </div>
</body>
</html>
