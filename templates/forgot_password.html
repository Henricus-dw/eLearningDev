<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">🔑 Forgot Password</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label for="identifier" class="form-label">Enter your Email, Student ID, or ID Number</label>
            <input type="text" class="form-control" id="identifier" name="identifier" required placeholder="Email, Student ID, or ID Number">
        </div>
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>

    <p class="mt-3"><a href="{{ url_for('login') }}">Back to Login</a></p>
</body>
</html>
