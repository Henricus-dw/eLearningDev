<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Final Assessment Questions - {{ course.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script>
    let questionIndex = 0;

    function addQuestionBlock() {
      questionIndex++;

      const container = document.createElement('div');
      container.className = 'card mt-4 p-3';
      container.innerHTML = `
        <h5>Question ${questionIndex}</h5>

        <div class="mb-2">
          <label>Question:</label>
          <textarea name="questions[${questionIndex}][question]" class="form-control" rows="2" required></textarea>
        </div>

        <div class="mb-2">
          <label>Option A:</label>
          <input type="text" name="questions[${questionIndex}][option_a]" class="form-control" required>
        </div>

        <div class="mb-2">
          <label>Option B:</label>
          <input type="text" name="questions[${questionIndex}][option_b]" class="form-control" required>
        </div>

        <div class="mb-2">
          <label>Option C:</label>
          <input type="text" name="questions[${questionIndex}][option_c]" class="form-control" required>
        </div>

        <div class="mb-2">
          <label>Option D:</label>
          <input type="text" name="questions[${questionIndex}][option_d]" class="form-control" required>
        </div>

        <div class="mb-2">
          <label>Correct Option:</label>
          <select name="questions[${questionIndex}][correct_option]" class="form-select" required>
            <option value="">-- Select --</option>
            <option value="a">A</option>
            <option value="b">B</option>
            <option value="c">C</option>
            <option value="d">D</option>
          </select>
        </div>
      `;
      document.getElementById('questionBlocks').appendChild(container);
    }
  </script>
</head>
<body class="container mt-5">

  <h2>Add Final Assessment Questions for "{{ course.title }}"</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }} mt-3">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <div id="questionBlocks"></div>

    <button type="button" class="btn btn-outline-primary mt-3" onclick="addQuestionBlock()">➕ Add Question</button>
    <br><br>
    <button type="submit" class="btn btn-success">✅ Save All Questions</button>
  </form>

  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">⬅ Back to Dashboard</a>
</body>
</html>
