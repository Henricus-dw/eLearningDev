<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sub-Chapter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h2>Add Sub-Chapter to: {{ chapter.title }}</h2>

    <form method="POST" action="{{ url_for('add_sub_chapter', chapter_id=chapter.id) }}">
        <div class="mb-3">
            <label for="sub_title" class="form-label">Sub-Chapter Title</label>
            <input type="text" id="sub_title" name="sub_title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="sub_content" class="form-label">Sub-Chapter Content</label>
            <textarea id="sub_content" name="sub_content" class="form-control" required></textarea>
        </div>
        <button type="submit" class="btn btn-success">➕ Add Sub-Chapter</button>
    </form>

    <a href="{{ url_for('edit_chapter', chapter_id=chapter.id) }}" class="btn btn-secondary mt-3">⬅ Back to Chapter</a>

</body>
</html>
